name: Descomprimir proyecto
on:
  push:
    paths: ['.github/workflows/descomprimir.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  descomprimir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir zip en la raiz
        run: |
          unzip -o -q astra-perfumeria.zip -d /tmp/x
          cp -r /tmp/x/astra-perfumeria/. .
          git rm -q astra-perfumeria.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Descomprimir proyecto Astra Perfumeria"
          git push
